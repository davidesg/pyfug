name: Publish

# Pure-Python package: build the sdist + universal wheel and publish to PyPI via
# trusted publishing (OIDC) on a version tag. workflow_dispatch builds without
# publishing (the publish job is gated on the tag).
#
# 2026-09-25: este fichero estaba en GitHub desde el 20 de julio y Actions nunca
# lo registró —la lista de workflows del repo sólo tenía «Dependency Graph» y
# `gh workflow run publish.yml` daba 404—, así que pyfug no se había publicado
# nunca por aquí: la 2.0.0 se subió a mano. Este cambio existe para que GitHub
# lo registre. La publicación exige además un trusted publisher en PyPI para
# davidesg/pyfug, workflow publish.yml, entorno `pypi`.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          pip install build
          python -m build
      - name: Smoke-test the wheel
        run: |
          pip install dist/*.whl
          python -c "import pyfug; print('pyfug', getattr(pyfug, '__version__', '?'))"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      id-token: write   # trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
